name: LiftLog
options:
  bundleIdPrefix: com.benfrench
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Change this to something unique to you if Xcode says the ID is taken.
    APP_BUNDLE_ID: com.benfrench.liftlog
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  LiftLog:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LiftLog
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        AppGroupID: group.$(APP_BUNDLE_ID)
    entitlements:
      path: App/LiftLog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
    dependencies:
      - target: LiftLogWidget

  LiftLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: LiftLog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: group.$(APP_BUNDLE_ID)
    entitlements:
      path: Widget/LiftLogWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
